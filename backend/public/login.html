<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Chemistry Solitaire</title>


    <!-- Nunito Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">


    <!-- Tailwind compiled CSS -->
    <link rel="stylesheet" href="./css/output.css">

</head>


<body>

    <!-- ========================================
         REUSABLE HEADER
    ========================================= -->

    <div id="header"></div>



    <!-- ========================================
         LOGIN PAGE CONTENT
         We will build this next
    ========================================= -->

    <main class="login-page">

        <!-- ========================================
     LOGIN INTRO
========================================= -->

        <section class="login-intro">

            <!-- Log In Pill -->
            <div class="login-pill reveal" data-delay="0">
                Log In
            </div>


            <!-- Heading -->
            <h1 class="login-heading reveal" data-delay="120">
                Authentication
            </h1>


            <!-- Description -->
            <p class="login-description reveal" data-delay="240">
                Login, account creation, and learner profile setup.
            </p>

            <!-- Login Chemistry Cards -->
            <div class="login-cards reveal" data-delay="360">

                <img src="./images/login-cards.png"
                    alt="Chemistry revision cards showing Proton, Shell and Atomic Number">

            </div>
        </section>


        <!-- ========================================
     LOGIN FORM CARD
========================================= -->

        <section class="login-form-area reveal" data-delay="300">

            <div class="login-form-card">

                <!-- Login Card Header -->
                <div class="login-card-header">

                    <!-- Logo -->
                    <div class="login-card-logo">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8" />

                            <ellipse cx="12" cy="12" rx="9" ry="4" stroke="currentColor" stroke-width="1.5" />

                            <ellipse cx="12" cy="12" rx="9" ry="4" transform="rotate(60 12 12)" stroke="currentColor"
                                stroke-width="1.5" />

                            <ellipse cx="12" cy="12" rx="9" ry="4" transform="rotate(120 12 12)" stroke="currentColor"
                                stroke-width="1.5" />
                        </svg>
                    </div>


                    <h2 class="login-card-title">
                        Welcome Back
                    </h2>


                    <p class="login-card-subtitle">
                        Log in to continue your chemistry revision
                    </p>

<!-- ========================================
     LOGIN FORM
========================================= -->

<form class="login-form" action="dashboard.html">

    <!-- Email -->
    <div class="login-field">

        <label for="email">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
        >

    </div>


    <!-- Password -->
    <div class="login-field">

        <label for="password">
            Password
        </label>

        <div class="password-input-wrapper">

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button
                type="button"
                class="password-toggle"
                id="passwordToggle"
                aria-label="Show password"
            >
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                    aria-hidden="true"
                >
                    <path
                        d="M2.5 12C4.4 8.5 7.8 6.5 12 6.5C16.2 6.5 19.6 8.5 21.5 12C19.6 15.5 16.2 17.5 12 17.5C7.8 17.5 4.4 15.5 2.5 12Z"
                        stroke="currentColor"
                        stroke-width="1.7"
                    />

                    <circle
                        cx="12"
                        cy="12"
                        r="2.5"
                        stroke="currentColor"
                        stroke-width="1.7"
                    />
                </svg>
            </button>

        </div>

    </div>


    <!-- Forgot Password -->
    <div class="forgot-password-row">

        <a href="forgot-password.html">
            Forgot password?
        </a>

    </div>


    <!-- Login Button -->
    <button
        type="submit"
        class="login-submit-button"
    >
        Log In
    </button>


    <!-- Create Account -->
    <p class="login-create-account">
        Don’t have an account?
        <a href="signup.html">
            Create one free
        </a>
    </p>

</form>
                </div>

            </div>

        </section>

    </main>



    <!-- ========================================
         REUSABLE FOOTER
         We can keep/remove this later
    ========================================= -->

    <div id="footer"></div>



    <!-- Reusable Header -->
    <script src="./js/header.js"></script>

    <!-- Reusable Footer -->
    <script src="./js/footer.js"></script>

    <!-- General JavaScript -->
    <script src="./js/app.js"></script>

<script src="./js/api.js"></script>
</body>

</html>
