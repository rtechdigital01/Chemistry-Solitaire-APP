<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Set Up Your Profile | Chemistry Solitaire</title>


    <!-- ========================================
         NUNITO FONT
    ========================================= -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap"
        rel="stylesheet"
    >


    <!-- ========================================
         TAILWIND COMPILED CSS
    ========================================= -->

    <link
        rel="stylesheet"
        href="./css/output.css"
    >

</head>


<body>


    <!-- ========================================
         REUSABLE HEADER
    ========================================= -->

    <div id="header"></div>



    <!-- ========================================
         PROFILE SETUP PAGE
    ========================================= -->

    <main class="profile-setup-page">


        <!-- ========================================
             PROFILE STAGE

             Atom and profile card stay together
             inside this wrapper.
        ========================================= -->

        <section class="profile-stage">


            <!-- Atom Background -->
            <img
                src="./images/atom-background.png"
                alt=""
                class="profile-atom-background"
                aria-hidden="true"
            >



            <!-- ========================================
                 PROFILE CARD
            ========================================= -->

            <section class="profile-setup-card">


                <!-- ========================================
                     TOP CONTENT
                ========================================= -->

                <div
                    class="profile-top-content reveal"
                    data-delay="0"
                >


                    <!-- Account Created Pill -->
                    <div class="profile-status-pill">

                        <svg
                            class="profile-status-icon"
                            viewBox="0 0 24 24"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                            aria-hidden="true"
                        >
                            <path
                                d="M5 12.5L9.2 16.5L19 7"
                                stroke="currentColor"
                                stroke-width="2.2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />
                        </svg>

                        <span>
                            Account created! One more step.
                        </span>

                    </div>


                    <!-- Main Heading -->
                    <h1 class="profile-title">
                        Set Up Your Profile
                    </h1>


                    <!-- Subtitle -->
                    <p class="profile-subtitle">
                        Choose an avatar and display name
                    </p>

                </div>



                <!-- ========================================
                     AVATAR SECTION
                ========================================= -->

                <div
                    class="profile-avatar-section reveal"
                    data-delay="120"
                >

                    <h2 class="avatar-section-title">
                        Choose Your Avatar
                    </h2>


                    <div class="avatar-grid">


                        <!-- Chemist -->
                        <button
                            type="button"
                            class="avatar-option active"
                            data-avatar="chemist"
                            aria-pressed="true"
                        >

                            <span class="avatar-emoji">
                                🧪
                            </span>

                            <span class="avatar-name">
                                Chemist
                            </span>

                        </button>


                        <!-- Atom -->
                        <button
                            type="button"
                            class="avatar-option"
                            data-avatar="atom"
                            aria-pressed="false"
                        >

                            <span class="avatar-emoji">
                                ⚛️
                            </span>

                            <span class="avatar-name">
                                Atom
                            </span>

                        </button>


                        <!-- Scientist -->
                        <button
                            type="button"
                            class="avatar-option"
                            data-avatar="scientist"
                            aria-pressed="false"
                        >

                            <span class="avatar-emoji">
                                🔬
                            </span>

                            <span class="avatar-name">
                                Scientist
                            </span>

                        </button>


                        <!-- Lab -->
                        <button
                            type="button"
                            class="avatar-option"
                            data-avatar="lab"
                            aria-pressed="false"
                        >

                            <span class="avatar-emoji">
                                🌡️
                            </span>

                            <span class="avatar-name">
                                Lab
                            </span>

                        </button>


                        <!-- Crystal -->
                        <button
                            type="button"
                            class="avatar-option"
                            data-avatar="crystal"
                            aria-pressed="false"
                        >

                            <span class="avatar-emoji">
                                💎
                            </span>

                            <span class="avatar-name">
                                Crystal
                            </span>

                        </button>


                        <!-- Molecule -->
                        <button
                            type="button"
                            class="avatar-option"
                            data-avatar="molecule"
                            aria-pressed="false"
                        >

                            <span class="avatar-emoji">
                                🧬
                            </span>

                            <span class="avatar-name">
                                Molecule
                            </span>

                        </button>


                        <!-- Flask -->
                        <button
                            type="button"
                            class="avatar-option"
                            data-avatar="flask"
                            aria-pressed="false"
                        >

                            <span class="avatar-emoji">
                                ⚗️
                            </span>

                            <span class="avatar-name">
                                Flask
                            </span>

                        </button>


                        <!-- Nature -->
                        <button
                            type="button"
                            class="avatar-option"
                            data-avatar="nature"
                            aria-pressed="false"
                        >

                            <span class="avatar-emoji">
                                🦋
                            </span>

                            <span class="avatar-name">
                                Nature
                            </span>

                        </button>

                        <!-- Upload Your Own Photo -->
                        <button
                            type="button"
                            class="avatar-option upload-avatar-option"
                            id="uploadAvatarButton"
                            aria-pressed="false"
                        >
                            <span class="avatar-upload-preview" id="avatarUploadPreview">

                                <svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    xmlns="http://www.w3.org/2000/svg"
                                    aria-hidden="true"
                                >
                                    <path
                                        d="M12 5V19"
                                        stroke="currentColor"
                                        stroke-width="2"
                                        stroke-linecap="round"
                                    />

                                    <path
                                        d="M5 12H19"
                                        stroke="currentColor"
                                        stroke-width="2"
                                        stroke-linecap="round"
                                    />
                                </svg>

                            </span>

                            <span class="avatar-name">
                                Your Photo
                            </span>
                        </button>


                        <!-- Hidden Image Picker -->
                        <input
                            type="file"
                            id="avatarFileInput"
                            accept="image/png, image/jpeg, image/webp"
                            hidden
                        >

                    </div>

                </div>



                <!-- ========================================
                     DISPLAY NAME
                ========================================= -->

                <div
                    class="profile-name-section reveal"
                    data-delay="240"
                >

                    <label
                        for="displayName"
                        class="profile-field-label"
                    >
                        Display Name
                    </label>


                    <input
                        type="text"
                        id="displayName"
                        name="displayName"
                        class="profile-name-input"
                        value="Alex"
                        maxlength="30"
                        autocomplete="nickname"
                    >

                </div>



                <!-- ========================================
                     PROFILE PREVIEW
                ========================================= -->

                <div
                    class="profile-preview reveal"
                    data-delay="320"
                >

                    <div class="profile-preview-avatar">
                        🧪
                    </div>


                    <div class="profile-preview-content">

                        <h3 class="profile-preview-title">
                            Preview:
                            <span id="previewName">
                                Alex
                            </span>
                        </h3>

                        <p class="profile-preview-description">
                            How your profile appears in your portal
                        </p>

                    </div>

                </div>



                <!-- ========================================
                     ENTER PORTAL BUTTON
                ========================================= -->

                <a
                    href="./dashboard.html"
                    class="enter-portal-button reveal"
                    data-delay="400"
                >

                    <svg
                        class="enter-portal-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true"
                    >
                        <path
                            d="M5 12H19"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                        />

                        <path
                            d="M13 6L19 12L13 18"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                    </svg>
                    <span>Enter My Portal</span>
                </a>


            </section>

        </section>

    </main>



    <!-- ========================================
         REUSABLE FOOTER
    ========================================= -->

    <div id="footer"></div>



    <!-- ========================================
         JAVASCRIPT
    ========================================= -->

    <script src="./js/header.js"></script>

    <script src="./js/footer.js"></script>

    <script src="./js/app.js"></script>


<script src="./js/api.js"></script>
</body>

</html>
