<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Chemistry Solitaire</title>
    
    <!-- Nunito Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind compiled CSS -->
    <link rel="stylesheet" href="./css/output.css">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <!-- ========================================
         REUSABLE HEADER
    ========================================= -->
    <div id="header"></div>

    <!-- ========================================
         SIGNUP PAGE CONTENT
    ========================================= -->
    <main class="login-page">

        <!-- LOGIN INTRO -->
        <section class="login-intro">
            <!-- Log In Pill -->
            <div class="login-pill reveal" data-delay="0" style="background-color: #E0E7FF; color: #4338CA;">
                Sign Up
            </div>

            <!-- Heading -->
            <h1 class="login-heading reveal" data-delay="120">
                Authentication
            </h1>

            <!-- Description -->
            <p class="login-description reveal" data-delay="240">
                Login, account creation, and learner profile setup.
            </p>

            <!-- Login Chemistry Cards -->
            <div class="login-cards reveal" data-delay="360">
                <img src="./images/login-cards.png" alt="Chemistry revision cards showing Proton, Shell and Atomic Number">
            </div>
        </section>

        <!-- ========================================
         SIGNUP FORM CARD
        ========================================= -->
        <section class="login-form-area reveal" data-delay="300">
            <div class="login-form-card" style="padding-top: 32px; padding-bottom: 32px;">
                
                <!-- Card Header -->
                <div class="login-card-header">
                    <!-- Icon -->
                    <div class="login-card-logo" style="background-color: #EFF6FF; color: #2563EB;">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="24" height="24">
                            <path d="M12 12C14.7614 12 17 9.76142 17 7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7C7 9.76142 9.23858 12 12 12Z" fill="currentColor"/>
                            <path d="M12.0002 14.5C6.99023 14.5 2.91023 17.86 2.91023 22C2.91023 22.28 3.13023 22.5 3.41023 22.5H20.5902C20.8702 22.5 21.0902 22.28 21.0902 22C21.0902 17.86 17.0102 14.5 12.0002 14.5Z" fill="currentColor"/>
                        </svg>
                    </div>

                    <h2 class="login-card-title">
                        Create Account
                    </h2>
                    <p class="login-card-subtitle">
                        Age 13 plus. No payment required.
                    </p>
                </div>

                <!-- SIGNUP FORM -->
                <form class="login-form" action="check-email.html">
                    
                    <!-- First Name -->
                    <div class="login-field">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" name="firstName" placeholder="Alex" required>
                    </div>

                    <!-- Email -->
                    <div class="login-field">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="alex@school.ac.uk" autocomplete="email" required>
                    </div>

                    <!-- Year Group -->
                    <div class="login-field">
                        <label for="yearGroup">Year Group</label>
                        <select id="yearGroup" name="yearGroup" required class="form-select" style="width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid #E2E8F0; background-color: #F8FAFC; color: #475569; font-size: 15px; font-weight: 500; font-family: 'Nunito', sans-serif; outline: none; appearance: none; background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%2394A3B8%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E'); background-repeat: no-repeat; background-position: right 16px center; background-size: 16px;">
                            <option value="" disabled selected>Select your year group</option>
                            <option value="Year 9">Year 9</option>
                            <option value="Year 10">Year 10</option>
                            <option value="Year 11">Year 11</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <!-- Password -->
                    <div class="login-field">
                        <label for="password">Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="password" name="password" placeholder="Create a strong password" required>
                            <button type="button" class="password-toggle" aria-label="Show password">
                                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                    <path d="M2.5 12C4.4 8.5 7.8 6.5 12 6.5C16.2 6.5 19.6 8.5 21.5 12C19.6 15.5 16.2 17.5 12 17.5C7.8 17.5 4.4 15.5 2.5 12Z" stroke="currentColor" stroke-width="1.7"/>
                                    <circle cx="12" cy="12" r="2.5" stroke="currentColor" stroke-width="1.7"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Terms Checkbox -->
                    <div class="login-field" style="margin-bottom: 24px;">
                        <label class="terms-checkbox" style="display: flex; align-items: flex-start; gap: 12px; cursor: pointer; font-size: 13px; font-weight: 600; color: #64748B;">
                            <input type="checkbox" required style="margin-top: 4px; width: 16px; height: 16px; accent-color: #2563EB;">
                            <span>I agree to the Terms of Use, Student Info Policy, and Privacy Policy.</span>
                        </label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="login-submit-button">
                        Create Account
                    </button>

                    <!-- Login Link -->
                    <p class="login-create-account" style="margin-top: 24px;">
                        Already have an account?
                        <a href="login.html">Log In</a>
                    </p>
                </form>
            </div>
        </section>
    </main>

    <!-- ========================================
         REUSABLE FOOTER
    ========================================= -->
    <div id="footer"></div>

    <script src="./js/header.js"></script>
    <script src="./js/footer.js"></script>
    <script src="./js/app.js"></script>
<script src="./js/api.js"></script>
</body>
</html>
