<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Chemistry Solitaire</title>
    
    <!-- Nunito Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind compiled CSS -->
    <link rel="stylesheet" href="./css/output.css">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <!-- ========================================
         REUSABLE HEADER
    ========================================= -->
    <div id="header"></div>

    <!-- ========================================
         FORGOT PASSWORD PAGE CONTENT
    ========================================= -->
    <main class="login-page">

        <!-- INTRO -->
        <section class="login-intro">
            <!-- Log In Pill -->
            <div class="login-pill reveal" data-delay="0">
                Recover
            </div>

            <!-- Heading -->
            <h1 class="login-heading reveal" data-delay="120">
                Authentication
            </h1>

            <!-- Description -->
            <p class="login-description reveal" data-delay="240">
                Login, account creation, and learner profile setup.
            </p>

            <!-- Chemistry Cards -->
            <div class="login-cards reveal" data-delay="360">
                <img src="./images/login-cards.png" alt="Chemistry revision cards showing Proton, Shell and Atomic Number">
            </div>
        </section>

        <!-- ========================================
         FORGOT PASSWORD FORM CARD
        ========================================= -->
        <section class="login-form-area reveal" data-delay="300">
            <div class="login-form-card" style="padding-top: 48px; padding-bottom: 48px;">
                
                <!-- Card Header -->
                <div class="login-card-header">
                    <!-- Icon -->
                    <div class="login-card-logo">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="24" height="24">
                            <path d="M12 11V16M12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12C21 16.9706 16.9706 21 12 21Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M12 8H12.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>

                    <h2 class="login-card-title">
                        Forgot Password
                    </h2>
                    <p class="login-card-subtitle" style="max-width: 300px; margin: 0 auto 24px;">
                        Enter your email address and we'll send you a link to reset your password.
                    </p>
                </div>

                <!-- FORGOT PASSWORD FORM -->
                <form class="login-form" action="login.html">
                    
                    <!-- Email -->
                    <div class="login-field">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="login-submit-button" onclick="alert('Password reset link sent! (Demo purposes)');">
                        Send Reset Link
                    </button>

                    <!-- Back to Login Link -->
                    <p class="login-create-account" style="margin-top: 24px;">
                        Remember your password?
                        <a href="login.html">Back to Login</a>
                    </p>
                </form>
            </div>
        </section>
    </main>

    <!-- ========================================
         REUSABLE FOOTER
    ========================================= -->
    <div id="footer"></div>

    <script src="./js/header.js"></script>
    <script src="./js/footer.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
