<header class="site-header">

    <div class="header-inner">

        <!-- Logo -->
        <a href="/index" class="brand">

            <div class="brand-icon">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                    aria-hidden="true"
                >
                    <circle
                        cx="12"
                        cy="12"
                        r="3"
                        stroke="currentColor"
                        stroke-width="1.8"
                    />

                    <ellipse
                        cx="12"
                        cy="12"
                        rx="9"
                        ry="4"
                        stroke="currentColor"
                        stroke-width="1.5"
                    />

                    <ellipse
                        cx="12"
                        cy="12"
                        rx="9"
                        ry="4"
                        transform="rotate(60 12 12)"
                        stroke="currentColor"
                        stroke-width="1.5"
                    />

                    <ellipse
                        cx="12"
                        cy="12"
                        rx="9"
                        ry="4"
                        transform="rotate(120 12 12)"
                        stroke="currentColor"
                        stroke-width="1.5"
                    />

                </svg>

            </div>

            <span>Science Solitaire</span>

        </a>


        <!-- Desktop Navigation -->
        <nav class="header-nav">

            <a href="/why-solitaire">
                Why SciSolitaire?
            </a>

            <a href="/gameplay">
                Gameplay Preview
            </a>

            <a href="/curriculum">
                Science Curriculum
            </a>

            <a href="/about">
                About
            </a>

            <a href="/login">
                Log In
            </a>


            <!-- Play Now -->
            <a href="/dashboard" class="header-play-button">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                    aria-hidden="true"
                >
                    <path
                        d="M8 5L19 12L8 19V5Z"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linejoin="round"
                    />
                </svg>

                <span>Play Now</span>

            </a>

        </nav>


        <!-- Mobile Menu Button -->
        <button
            class="mobile-menu-button"
            id="mobileMenuButton"
            type="button"
            aria-label="Open navigation"

            <span></span>
