        <!-- ========================================

<!-- ========================================
     CHEMISTRY DECK CARDS

<!-- ========================================
     CHEMISTRY DECK CARDS (data-driven)
========================================= -->
<section class="deck-cards-section">

        <p style="padding: 24px; color: #64748B; font-weight: 700;">Loading decks…</p>
    </div>

<!-- ============================================================
     LEVEL SELECT MODAL — replaces the old easy/medium/hard picker.
     Lists every level for the chosen deck, grouped by difficulty,
     progressively unlocked as earlier levels are completed.
============================================================ -->

<div
    id="levelSelectModal"
    style="
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(15,23,42,0.55);
        backdrop-filter: blur(6px);
        z-index: 9999;
        align-items: center;
        justify-content: center;
        padding: 20px;
    "
>
    <div style="
        width: 100%;
        max-width: 560px;
        max-height: 85vh;
        overflow-y: auto;
        background: #FFFFFF;
        border-radius: 24px;
        padding: 32px 28px;
        box-shadow: 0 28px 70px rgba(15,23,42,0.22);
        font-family: 'Nunito', sans-serif;
        animation: diffModalIn 0.25s ease;
    ">
        <div style="display:flex; align-items:flex-start; justify-content:space-between; margin-bottom: 6px;">
            <div>
                <h3 style="margin:0 0 4px; color:#0F172A; font-size:22px; font-weight:900;" id="levelModalTitle">
                    Choose a Level
                </h3>
                <p style="margin:0; color:#64748B; font-size:13px; font-weight:600;">
                    Complete a level to unlock the next one.
                </p>
            </div>
            <button
                type="button"
                id="closeLevelModal"
                aria-label="Close"
                style="
                    flex-shrink:0; width:32px; height:32px; border:none; border-radius:8px;
                    background:#F1F5F9; color:#64748B; font-size:16px; font-weight:900; cursor:pointer;
                "
            >✕</button>
        </div>

        <div id="levelModalGroups" style="margin-top: 18px; display:flex; flex-direction:column; gap: 22px;"></div>
    </div>
</div>


    </main>


    <!-- Reusable Footer -->
    <div id="footer"></div>


    <!-- Reusable Header -->
    <script src="./js/header.js"></script>

    <!-- Reusable Footer -->
    <script src="./js/footer.js"></script>

    <!-- General JS -->
    <script src="./js/app.js"></script>

<script src="./js/api.js"></script>








<style>
@keyframes diffModalIn {
    from { opacity:0; transform: scale(0.92) translateY(16px); }
    to   { opacity:1; transform: scale(1)    translateY(0); }
}

.level-tile {
    width: 100%;
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px;
    border-radius: 12px;
    border: 2px solid #E2E8F0;
    background: #F8FAFC;
    font-family: 'Nunito', sans-serif;
    font-size: 13px; font-weight: 800;
    color: #334155;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
}
.level-tile:hover:not(:disabled) {
    border-color: #2563EB;
    box-shadow: 0 4px 12px rgba(37,99,255,0.15);
    transform: translateY(-1px);
}
.level-tile:disabled {
    cursor: not-allowed;
    opacity: 0.55;
}
.level-tile.completed {
    border-color: #86EFAC;
    background: #F0FDF4;
    color: #14532D;
}
.level-tile .level-tile-icon { font-size: 15px; flex-shrink: 0; }

.difficulty-group-heading {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 10px;
    font-size: 13px; font-weight: 900;
    text-transform: uppercase; letter-spacing: 0.5px;
}
.level-tile-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
    gap: 8px;
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const deckCardsGrid   = document.getElementById("deckCardsGrid");
    const decksCountEl    = document.getElementById("decksAvailableCount");
    const levelModal       = document.getElementById("levelSelectModal");
    const closeLevelModal  = document.getElementById("closeLevelModal");
    const levelModalTitle  = document.getElementById("levelModalTitle");
    const levelModalGroups = document.getElementById("levelModalGroups");

    const DECK_ICON = `
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="12" cy="12" r="2.5" stroke="currentColor" stroke-width="1.7" />
            <ellipse cx="12" cy="12" rx="8" ry="3.5" stroke="currentColor" stroke-width="1.5" />
            <ellipse cx="12" cy="12" rx="8" ry="3.5" transform="rotate(60 12 12)" stroke="currentColor" stroke-width="1.5" />
            <ellipse cx="12" cy="12" rx="8" ry="3.5" transform="rotate(120 12 12)" stroke="currentColor" stroke-width="1.5" />
        </svg>`;

    function getSubject() {
        const active = document.querySelector(".subject-tab.active");
        if (!active) return "chemistry";
        const t = active.textContent.trim().toLowerCase();
        if (t.includes("biology")) return "biology";
        if (t.includes("physics")) return "physics";
        return "chemistry";
    }

    // A tier is unlocked only once the tier before it is fully
    // cleared — Easy level 1 is always open. Levels within a tier
    // unlock one at a time as the previous one is completed.
    function computeUnlockState(difficulties, highestCompleted) {
        let previousTierCleared = true;
        const state = {};
        difficulties.forEach(tier => {
            const diff = tier.difficulty;
            const maxLevels = tier.max_levels;
            const highest = highestCompleted[diff] || 0;
            const unlockedCount = previousTierCleared ? Math.min(maxLevels, highest + 1) : 0;
            state[diff] = { maxLevels, unlockedCount, highest };
            previousTierCleared = previousTierCleared && highest >= maxLevels && maxLevels > 0;
        });
        return state;
    }

    function openLevelModal(deck) {
        levelModalTitle.textContent = deck.deck.replace(/-/g, " ").replace(/\b\w/g, c => c.toUpperCase());

        const token = localStorage.getItem("auth_token");
        const progressPromise = token
            ? fetch(`/api/gameplay/progress?deck=${encodeURIComponent(deck.deck)}&key_stage=${encodeURIComponent(deck.key_stage)}`, {
                headers: { Accept: "application/json", Authorization: `Bearer ${token}` },
            }).then(r => r.ok ? r.json() : { data: { highest_completed_level: {} } }).catch(() => ({ data: { highest_completed_level: {} } }))
            : Promise.resolve({ data: { highest_completed_level: {} } });

        levelModalGroups.innerHTML = `<p style="color:#94A3B8; font-weight:700; padding: 12px 0;">Loading your progress…</p>`;
        levelModal.style.display = "flex";

        progressPromise.then(res => {
            const highestCompleted = (res.data && res.data.highest_completed_level) || {};
            const unlockState = computeUnlockState(deck.difficulties, highestCompleted);

            levelModalGroups.innerHTML = "";

            const tierColors = {
                Easy:   { text: "#14532D", dot: "🌱" },
                Medium: { text: "#78350F", dot: "🔬" },
                Hard:   { text: "#7F1D1D", dot: "🔥" },
            };

            deck.difficulties.forEach(tier => {
                if (tier.max_levels === 0) return;

                const { unlockedCount, highest } = unlockState[tier.difficulty];
                const colors = tierColors[tier.difficulty] || { text: "#1E293B", dot: "●" };

                const group = document.createElement("div");
                group.innerHTML = `
                    <div class="difficulty-group-heading" style="color:${colors.text};">
                        <span>${colors.dot}</span>
                        <span>${tier.difficulty} — ${tier.max_levels} levels</span>
                    </div>
                    <div class="level-tile-grid"></div>
                `;
                const grid = group.querySelector(".level-tile-grid");

                for (let level = 1; level <= tier.max_levels; level++) {
                    const isCompleted = level <= highest;
                    const isUnlocked  = level <= unlockedCount;

                    const btn = document.createElement("button");
                    btn.type = "button";
                    btn.className = "level-tile" + (isCompleted ? " completed" : "");
                    btn.disabled = !isUnlocked;
                    btn.innerHTML = `
                        <span class="level-tile-icon">${isCompleted ? "✓" : (isUnlocked ? "▶" : "🔒")}</span>
                        <span>Lvl ${level}</span>
                    `;
                    if (isUnlocked) {
                        btn.addEventListener("click", () => {
                            const subject = getSubject();
                            window.location.href =
                                `gameplay.html?subject=${encodeURIComponent(subject)}&deck=${encodeURIComponent(deck.deck)}&key_stage=${encodeURIComponent(deck.key_stage)}&difficulty=${encodeURIComponent(tier.difficulty.toLowerCase())}&level=${level}`;
                        });
                    }
                    grid.appendChild(btn);
                }

                levelModalGroups.appendChild(group);
            });
        });
    }

    function renderDeckCard(deck) {
        const card = document.createElement("article");
        card.className = "deck-card deck-card-playable";

        const title = deck.deck.replace(/-/g, " ").replace(/\b\w/g, c => c.toUpperCase());

        card.innerHTML = `
            <div class="deck-card-top">
                <div class="deck-card-heading-row">
                    <div class="deck-icon deck-icon-playable">${DECK_ICON}</div>
                    <div class="deck-heading-text">
                        <h3 class="deck-title">${title}</h3>
                        <p class="deck-level">${deck.key_stage} · ${deck.total_levels} levels across Easy, Medium &amp; Hard</p>
                        <span class="deck-status deck-status-playable">Fully Playable</span>
                    </div>
                </div>
            </div>
            <div class="deck-card-body">
                <p class="deck-outcomes-heading">DIFFICULTY BREAKDOWN</p>
                <ul class="deck-outcomes">
                    ${deck.difficulties.filter(d => d.max_levels > 0).map(d => `<li>${d.difficulty}: ${d.max_levels} levels</li>`).join("")}
                </ul>
                <button type="button" class="deck-play-button">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M8 5L19 12L8 19V5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
                    </svg>
                    <span>Choose a Level</span>
                </button>
            </div>
        `;

        card.querySelector(".deck-play-button").addEventListener("click", () => openLevelModal(deck));
        return card;
    }

    function loadDecks() {
        fetch("/api/chemistry/decks", { headers: { Accept: "application/json" } })
            .then(r => r.json())
            .then(res => {
                const decks = (res.data || []).filter(d => d.total_levels > 0);

                deckCardsGrid.innerHTML = "";
                if (decks.length === 0) {
                    deckCardsGrid.innerHTML = `<p style="padding:24px; color:#64748B; font-weight:700;">No decks available yet.</p>`;
                } else {
                    decks.forEach(deck => deckCardsGrid.appendChild(renderDeckCard(deck)));
                }

                if (decksCountEl) {
                    decksCountEl.textContent = `${decks.length} deck${decks.length !== 1 ? "s" : ""} available`;
                }
            })
            .catch(() => {
                deckCardsGrid.innerHTML = `<p style="padding:24px; color:#EF4444; font-weight:700;">Couldn't load decks. Please refresh.</p>`;
                if (decksCountEl) decksCountEl.textContent = "0 decks available";
            });
    }

    // Close modal
    if (closeLevelModal) {
        closeLevelModal.addEventListener("click", () => { levelModal.style.display = "none"; });
    }
    levelModal?.addEventListener("click", e => {
        if (e.target === levelModal) levelModal.style.display = "none";
    });

    // Subject tab toggle
    document.querySelectorAll(".subject-tab").forEach(tab => {
        tab.addEventListener("click", function () {
            document.querySelectorAll(".subject-tab").forEach(t => {
                t.style.background = "white";
                t.style.color      = "#475569";
                t.style.border     = "1px solid #E2E8F0";
                t.classList.remove("active");
            });
            this.style.background = "#2563EB";
            this.style.color      = "white";
            this.style.border     = "none";
            this.classList.add("active");
            loadDecks();
        });
    });

    // Mark Chemistry as active by default
    const firstTab = document.querySelector(".subject-tab");
    if (firstTab) {
        firstTab.classList.add("active");
        firstTab.style.background = "#2563EB";
        firstTab.style.color      = "white";
        firstTab.style.border     = "none";
    }

    loadDecks();

});
</script>

</body>
