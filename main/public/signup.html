<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | SciSolitaire</title>

    <!-- Nunito Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Choices.js CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />

    <!-- Tailwind compiled CSS -->
    <link rel="stylesheet" href="./css/output.css">
    <link rel="stylesheet" href="./css/style.css">

    <style>
        .choices__inner {
            background-color: #F8FAFC !important;
            border: 1px solid #E2E8F0 !important;
            border-radius: 8px !important;
            padding: 6px 16px !important;
            font-size: 15px !important;
            font-family: 'Nunito', sans-serif !important;
            color: #475569 !important;
            min-height: 48px !important;
            display: flex;
            align-items: center;
        }
        .choices__list--dropdown {
            border-radius: 8px !important;
            border: 1px solid #E2E8F0 !important;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1) !important;
            z-index: 10 !important;
        }
        .choices[data-type*=select-one]:after {
            right: 16px !important;
        }
    </style>
</head>


<body>

    <!-- ========================================
         REUSABLE HEADER
    ========================================= -->
    <div id="header"></div>


    <!-- ========================================
         SIGNUP PAGE CONTENT
    ========================================= -->
    <main class="login-page">

        <!-- SIGNUP INTRO -->
        <section class="login-intro">

            <!-- Sign Up Pill -->
            <div class="login-pill reveal" data-delay="0" style="background-color: #E0E7FF; color: #4338CA;">
                Sign Up
            </div>

            <!-- Heading -->
            <h1 class="login-heading reveal" data-delay="120">
                Authentication
            </h1>

            <!-- Description -->
            <p class="login-description reveal" data-delay="240">
                Sign up to continue your science journey and track progress.
            </p>

            <!-- Subject Solitaire Cards -->
            <div class="login-cards reveal" data-delay="360">

                <!-- Biology — green / club ♣ -->
                <div class="intro-solitaire-card intro-solitaire-card--biology">
                    <div class="intro-card-corner intro-card-corner--tl">
                        <span class="intro-card-corner-index">B</span>
                        <span class="intro-card-corner-suit">♣</span>
                    </div>
                    <div class="intro-card-center">
                        <span class="intro-card-symbol">🧬</span>
                    </div>
                    <span class="intro-card-label">Biology</span>
                    <div class="intro-card-corner intro-card-corner--br" aria-hidden="true">
                        <span class="intro-card-corner-index">B</span>
                        <span class="intro-card-corner-suit">♣</span>
                    </div>
                </div>

                <!-- Chemistry — blue / diamond ♦ (lifted centre card) -->
                <div class="intro-solitaire-card intro-solitaire-card--chemistry intro-solitaire-card--lifted">
                    <div class="intro-card-corner intro-card-corner--tl">
                        <span class="intro-card-corner-index">Ch</span>
                        <span class="intro-card-corner-suit">♦</span>
                    </div>
                    <div class="intro-card-center">
                        <span class="intro-card-symbol">🧪</span>
                    </div>
                    <span class="intro-card-label">Chemistry</span>
                    <div class="intro-card-corner intro-card-corner--br" aria-hidden="true">
                        <span class="intro-card-corner-index">Ch</span>
                        <span class="intro-card-corner-suit">♦</span>
                    </div>
                </div>

                <!-- Physics — pink / heart ♥ -->
                <div class="intro-solitaire-card intro-solitaire-card--physics">
                    <div class="intro-card-corner intro-card-corner--tl">
                        <span class="intro-card-corner-index">Ph</span>
                        <span class="intro-card-corner-suit">♥</span>
                    </div>
                    <div class="intro-card-center">
                        <span class="intro-card-symbol">⚛️</span>
                    </div>
                    <span class="intro-card-label">Physics</span>
                    <div class="intro-card-corner intro-card-corner--br" aria-hidden="true">
                        <span class="intro-card-corner-index">Ph</span>
                        <span class="intro-card-corner-suit">♥</span>
                    </div>
                </div>

            </div>

        </section>


        <!-- ========================================
             SIGNUP FORM CARD
        ========================================= -->
        <section class="login-form-area reveal" data-delay="300">

            <div class="login-form-card" style="padding-top: 32px; padding-bottom: 32px;">

                <!-- Card Header -->
                <div class="login-card-header">

                    <!-- Icon -->
                    <div class="login-card-logo" style="background-color: #EFF6FF; color: #2563EB;">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"
                            width="24" height="24">
                            <path
                                d="M12 12C14.7614 12 17 9.76142 17 7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7C7 9.76142 9.23858 12 12 12Z"
                                fill="currentColor" />

                            <path
                                d="M12.0002 14.5C6.99023 14.5 2.91023 17.86 2.91023 22C2.91023 22.28 3.13023 22.5 3.41023 22.5H20.5902C20.8702 22.5 21.0902 22.28 21.0902 22C21.0902 17.86 17.0102 14.5 12.0002 14.5Z"
                                fill="currentColor" />
                        </svg>
                    </div>

                    <h2 class="login-card-title">
                        Create Account
                    </h2>

                </div>


                <!-- ========================================
                     SIGNUP FORM (MULTI-STEP)
                ========================================= -->
                <form class="login-form" id="registerForm" action="/check-email">

                    <!-- Progress Indicator -->
                    <div class="signup-progress">
                        <div id="step1-dot" class="signup-progress-step active"></div>
                        <div id="step2-dot" class="signup-progress-step"></div>
                        <div id="step3-dot" class="signup-progress-step"></div>
                    </div>

                    <!-- STEP 1: Account Basics -->
                    <div id="step1">
                        <!-- Role Selection -->
                        <div class="login-field" style="margin-bottom: 24px;">
                            <label class="login-field" style="display: block; font-weight: 700; color: #1E293B; margin-bottom: 8px;">I am a…</label>
                            <div class="role-card-group">
                                <label class="role-card-label">
                                    <input type="radio" name="role" value="student" id="roleStudent" checked>
                                    <span class="role-card-inner">
                                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                            <path d="M12 12C14.76 12 17 9.76 17 7C17 4.24 14.76 2 12 2C9.24 2 7 4.24 7 7C7 9.76 9.24 12 12 12Z" fill="currentColor"/>
                                            <path d="M12 14.5C6.99 14.5 2.91 17.86 2.91 22C2.91 22.28 3.13 22.5 3.41 22.5H20.59C20.87 22.5 21.09 22.28 21.09 22C21.09 17.86 17.01 14.5 12 14.5Z" fill="currentColor"/>
                                        </svg>
                                        Student
                                    </span>
                                </label>
                                <label class="role-card-label">
                                    <input type="radio" name="role" value="teacher" id="roleTeacher">
                                    <span class="role-card-inner">
                                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                            <path d="M3 9L12 5L21 9L12 13L3 9Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                                            <path d="M7 11V15C7 16.5 9.2 18 12 18C14.8 18 17 16.5 17 15V11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                        </svg>
                                        Teacher
                                    </span>
                                </label>
                            </div>
                        </div>

                        <!-- First Name -->
                        <div class="login-field">
                            <label for="firstName">First Name</label>
                            <input type="text" id="firstName" name="firstName" placeholder="Alex" autocomplete="given-name" required>
                        </div>

                        <!-- Email -->
                        <div class="login-field">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email" placeholder="alex@school.ac.uk" autocomplete="email" required>
                        </div>

                        <button type="button" class="login-submit-button" onclick="nextStep(2)">Continue</button>
                        
                        <p class="login-create-account" style="margin-top: 24px;">
                            Already have an account? <a href="/login">Log In</a>
                        </p>
                    </div>

                    <!-- STEP 2: Education Details -->
                    <div id="step2" style="display: none;">
                        
                        <!-- Country -->
                        <div class="login-field">
                            <label for="country">Country / Education System</label>
                            <select id="country" name="country" required>
                                <option value="" disabled selected>Select your country</option>
                                <option value="UK">United Kingdom</option>
                                <option value="Nigeria">Nigeria</option>
                                <option value="US">United States</option>
                                <option value="India">India</option>
                                <option value="Australia">Australia</option>
                                <option value="Canada">Canada</option>
                            </select>
                        </div>

                        <!-- Education Level -->
                        <div class="login-field" style="margin-top: 16px;">
                            <label for="educationLevel" id="educationLevelLabel">Education Level</label>
                            <select id="educationLevel" name="educationLevel" required disabled class="form-select" style="
                                    width: 100%;
                                    padding: 12px 16px;
                                    border-radius: 8px;
                                    border: 1px solid #E2E8F0;
                                    background-color: #F8FAFC;
                                    color: #475569;
                                    font-size: 15px;
                                    font-weight: 500;
                                    font-family: 'Nunito', sans-serif;
                                    outline: none;
                                    appearance: none;
                                    background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%2394A3B8%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E');
                                    background-repeat: no-repeat;
                                    background-position: right 16px center;
                                    background-size: 16px;
                                ">
                                <option value="" selected>Select your country first</option>
                            </select>
                        </div>

                        <div style="display: flex; gap: 12px; margin-top: 24px;">
                            <button type="button" class="login-submit-button--ghost" onclick="nextStep(1)">Back</button>
                            <button type="button" class="login-submit-button" onclick="nextStep(3)">Continue</button>
                        </div>
                    </div>

                    <!-- STEP 3: Security -->
                    <div id="step3" style="display: none;">
                        <!-- Password -->
                        <div class="login-field">
                            <label for="password">Password</label>
                            <div class="password-input-wrapper">
                                <input type="password" id="password" name="password" placeholder="Create a strong password" autocomplete="new-password" required>
                                <button type="button" class="password-toggle" aria-label="Show password">
                                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                        <path d="M2.5 12C4.4 8.5 7.8 6.5 12 6.5C16.2 6.5 19.6 8.5 21.5 12C19.6 15.5 16.2 17.5 12 17.5C7.8 17.5 4.4 15.5 2.5 12Z" stroke="currentColor" stroke-width="1.7" />
                                        <circle cx="12" cy="12" r="2.5" stroke="currentColor" stroke-width="1.7" />
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <!-- Confirm Password -->
                        <div class="login-field">
                            <label for="passwordConfirmation">Confirm Password</label>
                            <div class="password-input-wrapper">
                                <input type="password" id="passwordConfirmation" name="passwordConfirmation" placeholder="Enter your password again" autocomplete="new-password" required>
                                <button type="button" class="password-toggle" aria-label="Show password">
                                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                        <path d="M2.5 12C4.4 8.5 7.8 6.5 12 6.5C16.2 6.5 19.6 8.5 21.5 12C19.6 15.5 16.2 17.5 12 17.5C7.8 17.5 4.4 15.5 2.5 12Z" stroke="currentColor" stroke-width="1.7" />
                                        <circle cx="12" cy="12" r="2.5" stroke="currentColor" stroke-width="1.7" />
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <!-- Terms Checkbox -->
                        <div class="login-field" style="margin-bottom: 24px;">
                            <label class="terms-checkbox" style="display: flex; align-items: flex-start; gap: 12px; cursor: pointer; font-size: 13px; font-weight: 600; color: #64748B;">
                                <input type="checkbox" required style="margin-top: 4px; width: 16px; height: 16px; accent-color: #2563EB;">
                                <span>I agree to the Terms of Use, Student Info Policy, and Privacy Policy.</span>
                            </label>
                        </div>

                        <div style="display: flex; gap: 12px; margin-top: 24px;">
                            <button type="button" class="login-submit-button--ghost" onclick="nextStep(2)">Back</button>
                            <button type="submit" class="login-submit-button" id="finalSubmitBtn">Create Account</button>
                        </div>
                    </div>

                </form>

            </div>

        </section>

    </main>


    <!-- ========================================
         REUSABLE FOOTER
    ========================================= -->
    <div id="footer"></div>


    <!-- ========================================
         SCRIPTS
    ========================================= -->
    <script src="./js/header.js"></script>
    <script src="./js/footer.js"></script>
    <script src="./js/app.js"></script>
    
    <!-- Choices.js JS -->
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>

    <!-- Multi-Step Logic & Country Selection -->
    <script>
        // Multi-Step Navigation
        function nextStep(step) {
            // Very simple validation check before advancing
            if(step === 2) {
                const fname = document.getElementById('firstName').value;
                const email = document.getElementById('email').value;
                if(!fname || !email) {
                    alert('Please enter your first name and email.');
                    return;
                }
            }
            if(step === 3) {
                const country = document.getElementById('country').value;
                const edu = document.getElementById('educationLevel').value;
                if(!country || !edu) {
                    alert('Please select your country and education level.');
                    return;
                }
            }

            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'none';
            document.getElementById('step3').style.display = 'none';
            
            document.getElementById('step' + step).style.display = 'block';

            // Update progress bar
            ['step1-dot','step2-dot','step3-dot'].forEach(function(id, i) {
                const el = document.getElementById(id);
                el.classList.remove('active', 'done');
                if (i + 1 === step) el.classList.add('active');
                else if (i + 1 < step) el.classList.add('done');
            });
        }

        document.addEventListener("DOMContentLoaded", function () {

            // Initialize Choices.js
            const countryElement = document.getElementById('country');
            const choices = new Choices(countryElement, {
                searchEnabled: true,
                itemSelectText: '',
                placeholderValue: 'Select your country',
            });

            const educationLevelSelect = document.getElementById("educationLevel");
            const educationLevelLabel = document.getElementById("educationLevelLabel");

            const educationLevels = {
                UK: ["Year 7", "Year 8", "Year 9", "Year 10", "Year 11", "Year 12", "Year 13"],
                Nigeria: ["SS1", "SS2", "SS3", "UTME/Post secondary"],
                US: ["Middle School (Grades 6-8)", "High School (Grades 9-12)", "College"],
                India: ["Class 8", "Class 9", "Class 10", "Class 11", "Class 12"],
                Australia: ["Year 7", "Year 8", "Year 9", "Year 10", "Year 11", "Year 12"],
                Canada: ["Grade 7", "Grade 8", "Grade 9", "Grade 10", "Grade 11", "Grade 12"]
            };

            countryElement.addEventListener("change", function () {
                const country = this.value;
                educationLevelSelect.innerHTML = "";
                educationLevelSelect.disabled = false;

                const placeholder = document.createElement("option");
                placeholder.value = "";
                placeholder.disabled = true;
                placeholder.selected = true;

                if (country === "UK" || country === "Australia") {
                    educationLevelLabel.textContent = "Year Group";
                    placeholder.textContent = "Select your year group";
                } else if (country === "Nigeria") {
                    educationLevelLabel.textContent = "School Level";
                    placeholder.textContent = "Select your school level";
                } else {
                    educationLevelLabel.textContent = "Grade / Level";
                    placeholder.textContent = "Select your grade";
                }

                educationLevelSelect.appendChild(placeholder);

                if (educationLevels[country]) {
                    educationLevels[country].forEach(function (level) {
                        const option = document.createElement("option");
                        option.value = level;
                        option.textContent = level;
                        educationLevelSelect.appendChild(option);
                    });
                }
            });

            // Store role on submit for dashboard simulation
            document.getElementById('registerForm').addEventListener('submit', function(e) {
                // e.preventDefault();
                const role = document.querySelector('input[name="role"]:checked').value;
                localStorage.setItem('userRole', role);
                // The form action will redirect to dashboard.html automatically since we aren't preventing default on successful validation
                // Though api.js intercepts this for the actual backend, we ensure it saves locally too.
            });
        });
    </script>

    <script src="./js/api.js"></script>

</body>
</html>
