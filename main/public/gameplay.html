<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gameplay | Chemistry Solitaire</title>
    <meta name="description" content="Play Chemistry Solitaire – sort cards into the correct chemistry categories to build your knowledge.">

    <!-- Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Compiled CSS -->
    <link rel="stylesheet" href="./css/output.css">
    <link rel="stylesheet" href="./css/style.css">

<style>

/* ============================================================
   RESET
============================================================ */
*, *::before, *::after { box-sizing: border-box; }

body {
    margin: 0;
    font-family: "Nunito", sans-serif;
    background: #F3F8FF;
    color: #14213D;
}


/* ============================================================
   KEYFRAMES
============================================================ */

@keyframes popupFadeIn   { from { opacity: 0; } to { opacity: 1; } }
@keyframes popupSlideUp  { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

@keyframes stackPulse {
    0%   { box-shadow: 0 0 0 0 rgba(37,99,255,0.5); }
    50%  { box-shadow: 0 0 0 12px rgba(37,99,255,0); }
    100% { box-shadow: 0 0 0 0 rgba(37,99,255,0); }
}

@keyframes cardShake {
    0%,100% { transform: translateX(0); }
    20%     { transform: translateX(-8px); }
    40%     { transform: translateX(8px); }
    60%     { transform: translateX(-6px); }
    80%     { transform: translateX(6px); }
}

@keyframes dealIn {
    from { opacity: 0; transform: translateY(24px) scale(0.92); }
    to   { opacity: 1; transform: translateY(0)  scale(1); }
}

@keyframes progressGrow {
    from { width: 0%; }
}


/* ============================================================
   GAMEPLAY TOP BAR
============================================================ */

.gameplay-top-bar {
    position: sticky;
    top: 0;
    z-index: 30;

    width: 100%;
    min-height: 68px;

    background: #FFFFFF;
    border-bottom: 1px solid #E8EEF6;
    box-shadow: 0 4px 12px rgba(20,33,61,0.05);
}

.gameplay-top-inner {
    width: 100%;
    max-width: 1440px;
    min-height: 68px;
    margin: 0 auto;
    padding: 10px 40px;

    display: flex;
    align-items: center;
    gap: 24px;
}


/* LEFT */
.gameplay-level-info {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
}

.gameplay-close-btn {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid #E2E8F0;
    border-radius: 8px;
    background: #FFF;
    color: #64748B;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
}
.gameplay-close-btn:hover { background: #F1F5F9; color: #EF4444; }
.gameplay-close-btn svg   { width: 16px; height: 16px; }

.gameplay-level-text    { display: flex; flex-direction: column; line-height: 1.2; }
.level-label            { font-size: 9px; font-weight: 900; letter-spacing: 1.2px; color: #94A3B8; text-transform: uppercase; }
.level-title            { font-size: 13px; font-weight: 900; color: #14213D; }


/* PROGRESS */
.gameplay-progress-container {
    flex: 1;
    min-width: 200px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.gameplay-progress-track {
    width: 100%; height: 7px;
    border-radius: 999px;
    background: #E8EDF5;
    overflow: hidden;
}

.gameplay-progress-fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, #2563EB, #60A5FA);
    transition: width 0.5s cubic-bezier(.25,1,.5,1);
    width: 0%;
}

.gameplay-progress-text {
    font-size: 10px; font-weight: 800;
    color: #64748B; white-space: nowrap;
}


/* STATS */
.gameplay-stats-actions { display: flex; align-items: center; gap: 14px; }

.gameplay-stats {
    display: flex; align-items: center;
    gap: 2px;
    border: 1px solid #EDF1F7;
    border-radius: 10px;
    overflow: hidden;
}

.stat-item {
    min-width: 52px;
    padding: 5px 8px;
    text-align: center;
    border-right: 1px solid #EDF1F7;
}
.stat-item:last-child { border-right: none; }

.stat-icon  { width: 13px; height: 13px; margin: 0 auto 2px; color: #94A3B8; }
.stat-value { font-size: 11px; font-weight: 900; color: #14213D; display: block; }
.stat-label { font-size: 7px; font-weight: 700; text-transform: uppercase; color: #94A3B8; display: block; }


/* ACTIONS */
.gameplay-actions { display: flex; align-items: center; gap: 7px; }

.btn-action {
    min-height: 32px;
    padding: 0 13px;
    display: flex; align-items: center; justify-content: center;
    gap: 5px;
    border-radius: 999px;
    font-family: "Nunito", sans-serif;
    font-size: 10px; font-weight: 800;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.15s;
}
.btn-action:hover { opacity: 0.85; transform: translateY(-1px); }
.btn-action svg   { width: 13px; height: 13px; }

.btn-outline {
    border: 1px solid #C7DBFF;
    background: #FFF;
    color: #2563EB;
}

.btn-yellow {
    border: 1px solid #FFC83D;
    background: #FFC83D;
    color: #7C5600;
}


/* ============================================================
   MAIN
============================================================ */

.gameplay-main {
    position: relative;
    min-height: 100vh;
    background: linear-gradient(135deg, #EFF6FF 0%, #F9FAFB 60%, #F0FDF4 100%);
    overflow: hidden;
}

.gameplay-board {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 1260px;
    margin: 0 auto;
    padding: 40px 36px 100px;
}


/* ============================================================
   MOLECULE BG
============================================================ */

.game-molecule {
    position: absolute;
    z-index: 0;
    opacity: 0.18;
    pointer-events: none;
}
.game-molecule.top    { width: 300px; top: 0; left: -60px; }
.game-molecule.bottom { width: 320px; right: -55px; bottom: -40px; }
.game-molecule svg    { width: 100%; height: auto; }


/* ============================================================
   INFO BANNER
============================================================ */

.game-info-banner {
    width: 100%;
    min-height: 58px;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 48px;
    border-radius: 14px;
    background: linear-gradient(90deg, #FFD261, #FFD66B);
    color: #14213D;
    font-size: 14px;
    font-weight: 700;
    box-shadow: 0 7px 18px rgba(250,190,45,0.13);
    transition: background 0.3s ease, box-shadow 0.3s ease;
}

.info-icon-wrap {
    width: 32px; height: 32px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px;
    background: rgba(255,255,255,0.35);
}
.info-icon { width: 17px; height: 17px; }


/* ============================================================
   MIDDLE — MOVES BADGE & SHUFFLE PANELS
============================================================ */

.game-middle-actions {
    width: 100%;
    max-width: 1040px;
    margin: 0 auto 28px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
}

.moves-badge {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    width: 82px; height: 82px;
    background: linear-gradient(145deg, #F89E19, #F5B700);
    border-radius: 14px;
    color: white;
    box-shadow: 0 6px 16px rgba(248,158,25,0.35);
    flex-shrink: 0;
}

.moves-label {
    font-size: 10px; font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 2px;
    opacity: 0.9;
}

.moves-value {
    font-size: 26px; font-weight: 900;
    line-height: 1;
    transition: transform 0.2s;
}

.moves-value.bump {
    animation: pointsBump 0.3s ease;
}

@keyframes pointsBump {
    0%,100% { transform: scale(1); }
    40%     { transform: scale(1.3); }
}

/* — Shuffle panels — */

.shuffle-panels {
    display: flex;
    gap: 18px;
}

.shuffle-panel-heading {
    display: flex;
    align-items: stretch;
    gap: 8px;
    margin-bottom: 8px;
}

.shuffle-panel-heading .heading-accent {
    width: 3px;
}

.shuffle-panel-heading h3 {
    margin: 0;
    color: #14213D;
    font-size: 14px;
    font-weight: 900;
}

.shuffle-panel-heading p {
    margin: 1px 0 0;
    color: #94A3B8;
    font-size: 9px;
    font-weight: 700;
}

/* Reveal pile — the active playable hand (fanned peek of upcoming cards) */

.shuffle-reveal-pile {
    position: relative;
    width: 132px;
    height: 118px;
}

/* Higher specificity (#id + two classes) is required here because the
   base `.game-card` rule — full pile-card sizing — is declared later in
   this stylesheet and would otherwise win the cascade. */
#shuffleRevealPile .game-card.reveal-main-card {
    position: absolute;
    left: 0; top: 0;
    width: 92px; height: 118px;
    border: 2px solid #F1C345;
    border-radius: 12px;
    background: linear-gradient(180deg, #FFFBEA 0%, #FFF5CC 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6px;
    font-size: 12px;
    font-weight: 900;
    color: #14213D;
    box-shadow: 0 3px 0 0 #E5B800, 0 4px 10px rgba(20,33,61,0.12);
    cursor: pointer;
    gap: 0;
}

#shuffleRevealPile .game-card.reveal-main-card .card-crown {
    position: absolute;
    top: 6px; left: 8px;
    font-size: 12px;
    color: #F5B82E;
}

#shuffleRevealPile .game-card.reveal-main-card .card-name {
    font-size: 11px;
    padding: 0 2px;
}

.reveal-peek-card {
    position: absolute;
    top: 0;
    width: 20px; height: 118px;
    border: 2px solid #F1C345;
    border-radius: 10px;
    background: linear-gradient(180deg, #FFFBEA 0%, #FFF5CC 100%);
    box-shadow: 0 2px 6px rgba(20,33,61,0.10);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.reveal-peek-card span {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-size: 10px;
    font-weight: 800;
    color: #7C6425;
    white-space: nowrap;
}

.shuffle-reveal-empty {
    width: 92px; height: 118px;
    border: 2px dashed #E2E8F0;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    color: #CBD5E1;
    font-size: 11px;
    font-weight: 800;
    text-align: center;
    padding: 8px;
}

/* Shuffle deck — the remaining logical deck, pattern back + count badge */

.shuffle-deck-pile {
    position: relative;
    width: 92px; height: 118px;
    background:
        radial-gradient(#ffffff33 2px, transparent 2px),
        radial-gradient(#ffffff33 2px, transparent 2px),
        linear-gradient(145deg, #78C7EA, #5BB8E5);
    background-size: 14px 14px, 14px 14px, 100% 100%;
    background-position: 0 0, 7px 7px, 0 0;
    border: 2px solid #4DAAEB;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.14);
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
}
.shuffle-deck-pile:hover { transform: translateY(-3px); box-shadow: 0 10px 22px rgba(0,0,0,0.18); }
.shuffle-deck-pile.deck-empty { cursor: default; opacity: 0.5; }

.shuffle-deck-count {
    position: absolute;
    top: -8px; right: -8px;
    min-width: 24px; height: 24px;
    padding: 0 5px;
    display: flex; align-items: center; justify-content: center;
    background: #2563FF;
    color: #fff;
    font-size: 11px; font-weight: 900;
    border-radius: 999px;
    border: 2px solid #fff;
    box-shadow: 0 2px 6px rgba(37,99,255,0.4);
}


/* ============================================================
   SECTION HEADINGS
============================================================ */

.figma-section-heading {
    display: flex;
    align-items: stretch;
    gap: 14px;
    margin-bottom: 30px;
}

.heading-accent {
    width: 5px;
    flex-shrink: 0;
    border-radius: 999px;
    background: #F5B82E;
}

.heading-copy h2 {
    margin: 0;
    color: #14213D;
    font-size: 28px; line-height: 1;
    font-weight: 900; letter-spacing: -0.5px;
}

.heading-copy p {
    margin: 6px 0 0;
    color: #5F6F88;
    font-size: 13px; font-weight: 600;
}


/* ============================================================
   CATEGORY / FOUNDATION SECTION
============================================================ */

.category-section {
    max-width: 1040px;
    margin: 0 auto;
}

.category-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 16px;
    align-items: stretch;
}

#stacksGrid { display: contents; }
#lockedCategorySlots { display: contents; }


/* Foundation stack card */

.foundation-stack {
    position: relative;
    min-height: 218px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    overflow: hidden;
    border: 2px solid #F1C345;
    border-radius: 16px;
    background: linear-gradient(180deg, #FFFBEA 0%, #FFF5CC 100%);
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(20,33,61,0.08);
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s;
    padding: 0;
}

.foundation-stack:hover {
    transform: translateY(-4px);
    box-shadow: 0 14px 28px rgba(20,33,61,0.13);
    border-color: #F3B51D;
}

.foundation-stack.stack-drag-over {
    border-color: #2563EB;
    box-shadow: 0 0 0 3px rgba(37,99,255,0.25), 0 14px 28px rgba(20,33,61,0.13);
    transform: translateY(-4px);
}

.foundation-stack.stack-pulse {
    animation: stackPulse 0.5s ease;
}

.foundation-stack.stack-hint {
    border-color: #16A34A;
    box-shadow: 0 0 0 3px rgba(22,163,74,0.3);
}

/* Card top strip */
.category-card-top {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 13px;
    border-bottom: 1px solid #F1C345;
}

.category-crown { font-size: 20px; color: #F3B51D; }

.category-progress {
    font-size: 12px; font-weight: 800;
    color: #6B7280;
}

.category-icon-circle {
    width: 60px; height: 60px;
    display: flex; align-items: center; justify-content: center;
    margin: 12px auto 6px;
    border-radius: 50%;
    background: #DDF3E5;
    color: #2E9D62;
    transition: transform 0.2s;
}
.foundation-stack:hover .category-icon-circle { transform: scale(1.08); }

.category-icon-circle svg { width: 30px; height: 30px; }

.stack-title {
    width: 100%;
    padding: 8px 13px 14px;
    text-align: center;
    font-size: 13px; font-weight: 900;
    color: #14213D;
    line-height: 1.3;
}

.category-card-divider {
    width: 100%; height: 1px;
    background: #F1E4B8;
}

.category-bottom-badge {
    margin: 10px 0 12px;
    min-width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    padding: 0 7px;
    border-radius: 999px;
    background: #FFF0B8;
    color: #A87500;
    font-size: 11px; font-weight: 900;
    text-transform: uppercase;
}


/* Locked slot */
.locked-category-card {
    min-height: 218px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    border: 2px dashed #E2E8F0;
    border-radius: 16px;
    background: #FAFBFC;
}

.locked-category-card span {
    color: #CBD5E1;
    font-size: 48px;
}


/* ============================================================
   DIVIDER
============================================================ */

.game-section-divider {
    width: 88%;
    height: 1px;
    margin: 52px auto 44px;
    background: #DCE8F5;
}


/* ============================================================
   GAME CARDS (HAND)
============================================================ */

.game-cards-section {
    max-width: 1040px;
    margin: 0 auto;
}

/* 
   The hand is a scrollable wrapping grid of cards.
   4 columns max; scrolls horizontally on narrow screens.
*/

/* ============================================================
   CARDS GRID — piles + stock/shuffle
============================================================ */

#cardsGrid {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    justify-content: center;
}

/* Each of the 4 playable piles */
.card-pile {
    position: relative;
    /* portrait: narrower width, tall enough for offset stack */
    width: 160px;
    flex-shrink: 0;
    /* height grows with stack offset; at least 2 visible card heights */
    min-height: 290px;
}

/* The stock/shuffle pile column */
.stock-pile {
    position: relative;
    width: 160px;
    flex-shrink: 0;
    min-height: 290px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
}

.stock-pile-label {
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #64748B;
    margin-bottom: 6px;
}

/* The generic game card — portrait rectangle */
.game-card {
    position: absolute;
    width: 100%;

    /* Portrait aspect: ~160 × 220 px */
    height: 220px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;

    padding: 22px 14px 16px;

    /* Neutral cream — NO category colour here */
    border: 2px solid #F1C345;
    border-radius: 16px;
    background: linear-gradient(180deg, #FFFBEA 0%, #FFF5CC 100%);
    color: #14213D;

    font-family: "Nunito", sans-serif;
    font-size: 15px;
    font-weight: 900;
    text-align: center;
    line-height: 1.3;

    cursor: pointer;
    user-select: none;

    box-shadow:
        0 3px 0 0 #E5B800,
        0 6px 14px rgba(20,33,61,0.14);

    transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        border-color 0.18s ease,
        top 0.25s ease;
}

.game-card:not(.card-face-down):hover {
    transform: translateY(-5px);
    box-shadow:
        0 3px 0 0 #E5B800,
        0 12px 22px rgba(20,33,61,0.18);
}

.game-card.card-selected {
    border-color: #2563EB;
    box-shadow:
        0 0 0 4px rgba(37,99,255,0.28),
        0 10px 22px rgba(20,33,61,0.18);
    transform: translateY(-5px);
}

.game-card.card-shake {
    animation: cardShake 0.55s ease;
}

.game-card.card-hint {
    border-color: #16A34A;
    box-shadow:
        0 0 0 4px rgba(22,163,74,0.3),
        0 10px 22px rgba(20,33,61,0.18);
}

/* Face-down card — patterned blue back, matching the shuffle deck */
.card-face-down {
    background:
        radial-gradient(#ffffff33 2.5px, transparent 2.5px),
        radial-gradient(#ffffff33 2.5px, transparent 2.5px),
        linear-gradient(145deg, #78C7EA, #5BB8E5) !important;
    background-size: 16px 16px, 16px 16px, 100% 100% !important;
    background-position: 0 0, 8px 8px, 0 0 !important;
    border-color: #4DAAEB !important;
    cursor: default !important;
    pointer-events: none;
    box-shadow: 0 3px 0 0 #3A8FCB, 0 6px 14px rgba(0,0,0,0.18) !important;
}
.card-face-down * { display: none !important; }

/* Crown icon top-left */
.card-crown {
    position: absolute;
    top: 10px; left: 12px;
    font-size: 16px;
    color: #F5B82E;
    line-height: 1;
}

/* Card text */
.card-name {
    font-size: 15px;
    font-weight: 900;
    line-height: 1.3;
    text-align: center;
    word-break: break-word;
    color: #14213D;
    padding: 0 4px;
}

/* NO category tag on the card — remove hint */
.card-category-tag { display: none !important; }


/* ============================================================
   BOTTOM CONTROLS
============================================================ */

.game-bottom-actions {
    margin-top: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
}

.bottom-game-btn {
    min-width: 160px;
    height: 54px;
    display: flex; align-items: center; justify-content: center;
    gap: 9px;
    border: 0; border-radius: 999px;
    font-family: "Nunito", sans-serif;
    font-size: 15px; font-weight: 800;
    cursor: pointer;
    box-shadow: 0 8px 18px rgba(20,33,61,0.14);
    transition: transform 0.18s, box-shadow 0.18s, opacity 0.18s;
}
.bottom-game-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(20,33,61,0.18); }

.restart-btn   { background: #14213D; color: #FFF; }
.next-level-btn { background: #E2E8F0; color: #94A3B8; box-shadow: none; }
.next-level-btn:not([disabled]) {
    background: linear-gradient(135deg, #2563EB, #1D4ED8);
    color: white;
    box-shadow: 0 8px 18px rgba(37,99,255,0.25);
}
.next-level-btn[disabled]       { cursor: not-allowed; }

.bottom-game-btn svg { width: 19px; height: 19px; }

#finishLevelBtn { display: none; }


/* ============================================================
   RESPONSIVE
============================================================ */

@media (max-width: 1150px) {
    .gameplay-top-inner { padding: 10px 22px; }
    .gameplay-stats      { display: none; }
    .category-grid       { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

@media (max-width: 880px) {
    .gameplay-top-inner        { flex-wrap: wrap; padding: 12px 16px; }
    .gameplay-progress-container { order: 3; width: 100%; }
    .gameplay-stats-actions    { margin-left: auto; }
    .gameplay-board            { padding: 28px 18px 70px; }
    .category-grid             { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .game-card                 { width: calc(50% - 9px); }
}

@media (max-width: 560px) {
    .gameplay-actions     { display: none; }
    .gameplay-board       { padding: 22px 14px 60px; }
    .heading-copy h2      { font-size: 23px; }
    .category-grid        { grid-template-columns: 1fr 1fr; gap: 10px; }
    .game-card            { min-width: 120px; min-height: 170px; font-size: 14px; }
    .game-bottom-actions  { gap: 10px; }
    .bottom-game-btn      { min-width: 0; flex: 1; height: 50px; }
}

</style>
</head>

<body>

<!-- Shared header -->
<div id="header"></div>


<!-- ============================================================
     GAMEPLAY TOP BAR
============================================================ -->

<div class="gameplay-top-bar">
    <div class="gameplay-top-inner">

        <!-- LEVEL -->
        <div class="gameplay-level-info">

            <button
                class="gameplay-close-btn"
                type="button"
                onclick="window.location.href='games.html'"
                aria-label="Exit game"
            >
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>

            <div class="gameplay-level-text">
                <span class="level-label">KS3 · Easy</span>
                <span class="level-title">Periodic Table &amp; Groups</span>
            </div>

        </div>


        <!-- PROGRESS -->
        <div class="gameplay-progress-container">
            <div class="gameplay-progress-track">
                <div class="gameplay-progress-fill" style="width:0%;"></div>
            </div>
            <span class="gameplay-progress-text">0/0</span>
        </div>


        <!-- STATS -->
        <div class="gameplay-stats-actions">

            <div class="gameplay-stats">

                <div class="stat-item">
                    <svg class="stat-icon" viewBox="0 0 24 24" fill="none">
                        <path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6L12 2z"
                            stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                    </svg>
                    <span class="stat-value">0</span>
                    <span class="stat-label">Score</span>
                </div>

                <div class="stat-item">
                    <svg class="stat-icon" viewBox="0 0 24 24" fill="none">
                        <path d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0h10a2 2 0 002-2V9M9 21H5a2 2 0 01-2-2V9m0 0h18"
                            stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                    </svg>
                    <span class="stat-value">0</span>
                    <span class="stat-label">Moves</span>
                </div>

                <div class="stat-item">
                    <svg class="stat-icon" viewBox="0 0 24 24" fill="none">
                        <rect x="2" y="5" width="20" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/>
                        <path d="M2 10h20" stroke="currentColor" stroke-width="1.6"/>
                    </svg>
                    <span class="stat-value">0</span>
                    <span class="stat-label">Cards</span>
                </div>

            </div>


            <!-- ACTION BUTTONS -->
            <div class="gameplay-actions">

                <button
                    type="button"
                    id="topRedealBtn"
                    class="btn-action btn-outline"
                    aria-label="Shuffle cards"
                >
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M16 3l4 4-4 4M20 7H4M8 21l-4-4 4-4M4 17h16"
                            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Shuffle
                </button>

                <button
                    type="button"
                    id="topHintBtn"
                    class="btn-action btn-yellow"
                    aria-label="Get a hint"
                >
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M9.5 2a7 7 0 000 14h5a7 7 0 000-14h-5z" stroke="currentColor" stroke-width="1.7"/>
                        <path d="M12 16v6M9 19h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                    </svg>
                    Hint
                </button>

            </div>

        </div>

    </div>
</div>


<!-- ============================================================
     MAIN GAMEPLAY
============================================================ -->

<main class="gameplay-main">

    <!-- Decorative molecules -->
    <div class="game-molecule top">
        <svg viewBox="0 0 320 260" fill="none">
            <circle cx="70" cy="60" r="45" stroke="#93C5FD" stroke-width="4"/>
            <circle cx="180" cy="130" r="36" stroke="#93C5FD" stroke-width="4"/>
            <circle cx="70" cy="205" r="29" stroke="#93C5FD" stroke-width="4"/>
            <path d="M105 87L150 112" stroke="#93C5FD" stroke-width="4"/>
            <path d="M149 150L95 188" stroke="#93C5FD" stroke-width="4"/>
        </svg>
    </div>

    <div class="game-molecule bottom">
        <svg viewBox="0 0 340 300" fill="none">
            <circle cx="70"  cy="165" r="48" stroke="#86EFAC" stroke-width="4"/>
            <circle cx="175" cy="85"  r="42" stroke="#86EFAC" stroke-width="4"/>
            <circle cx="185" cy="235" r="42" stroke="#86EFAC" stroke-width="4"/>
            <circle cx="290" cy="145" r="38" stroke="#86EFAC" stroke-width="4"/>
            <path d="M106 136L143 108" stroke="#86EFAC" stroke-width="4"/>
            <path d="M111 192L150 218" stroke="#86EFAC" stroke-width="4"/>
            <path d="M213 105L260 132" stroke="#86EFAC" stroke-width="4"/>
        </svg>
    </div>


    <div class="gameplay-board">

        <!-- INFO BANNER -->
        <div class="game-info-banner">
            <span class="info-icon-wrap">
                <svg class="info-icon" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
                    <path d="M12 11V16M12 8H12.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </span>
            Select a card from the hand below, then tap a category above.
        </div>



        <!-- MOVES & SHUFFLE PANELS -->
        <div class="game-middle-actions">

            <div class="moves-badge">
                <span class="moves-label">Moves</span>
                <span class="moves-value" id="movesValueBadge">0</span>
            </div>

            <div class="shuffle-panels">

                <!-- Active hand: top playable card + peek of what's next -->
                <div class="shuffle-panel">
                    <div class="shuffle-panel-heading">
                        <span class="heading-accent"></span>
                        <div>
                            <h3>Shuffle</h3>
                            <p>Select shuffled card</p>
                        </div>
                    </div>
                    <div class="shuffle-reveal-pile" id="shuffleRevealPile"></div>
                </div>

                <!-- Remaining logical deck, not yet dealt into play -->
                <div class="shuffle-panel">
                    <div class="shuffle-panel-heading">
                        <span class="heading-accent"></span>
                        <div>
                            <h3>Shuffle</h3>
                            <p>Shuffle before playing</p>
                        </div>
                    </div>
                    <div class="shuffle-deck-pile" id="shuffleDeckBtn" role="button" aria-label="Shuffle remaining cards into play">
                        <span class="shuffle-deck-count" id="shuffleDeckCount">0</span>
                    </div>
                </div>

            </div>

        </div>



        <!-- ==============================
             CATEGORY SECTION
        ============================== -->

        <section class="category-section" aria-label="Category foundation stacks">

            <div class="figma-section-heading">
                <span class="heading-accent"></span>
                <div class="heading-copy">
                    <h2>Category</h2>
                    <p>Choose a category to match your card</p>
                </div>
            </div>

            <div class="category-grid">
                <div id="stacksGrid"></div>
                <div id="lockedCategorySlots"></div>
            </div>

        </section>



        <div class="game-section-divider"></div>



        <!-- ==============================
             GAME CARDS (HAND)
        ============================== -->

        <section class="game-cards-section" aria-label="Card hand">

            <div class="figma-section-heading">
                <span class="heading-accent"></span>
                <div class="heading-copy">
                    <h2>Game Cards</h2>
                    <p>Build knowledge, one match at a time</p>
                </div>
            </div>

            <div id="cardsGrid" role="list" aria-label="Playable cards"></div>

            <!-- CONTROLS -->
            <div class="game-bottom-actions">

                <button
                    type="button"
                    class="bottom-game-btn restart-btn"
                    id="restartBtn"
                >
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M1 4v6h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M3.51 15a9 9 0 102.13-9.36L1 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Restart
                </button>

                <button
                    type="button"
                    class="bottom-game-btn next-level-btn"
                    id="nextLevelBtn"
                    disabled
                >
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Next Level
                </button>

            </div>

        </section>

    </div>

</main>


<!-- Shared footer -->
<div id="footer"></div>


<!-- Hidden finish button used by gameplay.js -->
<button type="button" id="finishLevelBtn" style="display:none;"></button>

<!-- Hidden hint / redeal refs used by gameplay.js -->
<button type="button" id="hintBtn"   style="display:none;"></button>
<button type="button" id="redealBtn" style="display:none;"></button>


<!-- ============================================================
     SCRIPTS
============================================================ -->

<script src="./js/header.js"></script>
<script src="./js/footer.js"></script>
<script src="./js/app.js"></script>
<script src="./js/api.js"></script>
<script src="./js/gameplay.js"></script>


<script>
/* ============================================================
   LOCKED CATEGORY SLOTS
   Fills empty category grid positions with dashed placeholder cards.
============================================================ */

const stacksGridEl       = document.getElementById("stacksGrid");
const lockedSlotsEl      = document.getElementById("lockedCategorySlots");
const TOTAL_CAT_SLOTS    = 5;

function refreshLockedSlots() {
    const filled  = stacksGridEl.children.length;
    const needed  = Math.max(0, TOTAL_CAT_SLOTS - filled);

    lockedSlotsEl.innerHTML = "";
    for (let i = 0; i < needed; i++) {
        const card = document.createElement("div");
        card.className = "locked-category-card";
        card.innerHTML = "<span>♛</span>";
        lockedSlotsEl.appendChild(card);
    }
}

new MutationObserver(refreshLockedSlots).observe(stacksGridEl, { childList: true });
refreshLockedSlots();


/* ============================================================
   TOP-BAR BRIDGE BUTTONS
   (Wire Shuffle / Hint top-bar buttons → gameplay.js helpers)
============================================================ */

document.getElementById("topRedealBtn")?.addEventListener("click", () => {
    window._gameShuffleHand?.();
});

document.getElementById("topHintBtn")?.addEventListener("click", () => {
    window._gameHintClick?.();
});
</script>


</body>
</html>
